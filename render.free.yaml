# Free 30-day hackathon demo. No paid upgrade is authorized.
# Render free Postgres expires 30 days after creation; export data before expiry.
databases:
  - name: scopepay-demo-db
    plan: free
    region: oregon
services:
  - type: web
    name: scopepay-demo
    runtime: node
    plan: free
    region: oregon
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: STORAGE_MODE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: scopepay-demo-db
          property: connectionString
      - key: NODE_VERSION
        value: 22.19.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DESK_KEY
        generateValue: true
      - key: AI_MODE
        value: demo
      - key: PAYPAL_MODE
        value: demo
# Add sandbox credentials privately and explicitly select sandbox mode after review.
